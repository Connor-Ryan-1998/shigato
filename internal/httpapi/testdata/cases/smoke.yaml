# Smoke cases: one per runner feature. Task 6 moves these into real case
# files.
seed:
  orgs: [acme, other]
  users:
    owner: {org: acme, role: owner}
    keeper: {org: acme, role: bookkeeper}
    tenant: {org: acme, role: tenant, contact: c_tenant}
  contacts:
    c_tenant: {org: acme, kind: tenant, name: Tina Tenant}
    c_foreign: {org: other, kind: client, name: Foreign Client}
  invoices:
    inv_foreign: {org: other, contact: c_foreign, status: issued}

cases:
  - name: owner cannot read a foreign org's invoice
    as: owner
    request: {method: GET, path: "/api/v1/orgs/acme/invoices/{inv_foreign}"}
    expect: {status: 404}

  - name: bookkeeper and tenant cannot create contacts
    as: [keeper, tenant]
    request:
      method: POST
      path: /api/v1/orgs/acme/contacts
      body: {kind: client, name: Sneaky}
    expect: {status: 403}
    unchanged: [contacts, audit_log]

  - name: anonymous cannot list contacts
    as: anonymous
    request: {method: GET, path: /api/v1/orgs/acme/contacts}
    expect: {status: 401}

  # CSRF is the outermost middleware, so 401 (not 403) proves the runner
  # sent X-Shigoto-CSRF on an anonymous unsafe request.
  - name: anonymous cannot create contacts
    as: anonymous
    request:
      method: POST
      path: /api/v1/orgs/acme/contacts
      body: {kind: client, name: Anon Client}
    expect: {status: 401}
    unchanged: [contacts, audit_log]

  - name: owner creates a contact
    as: owner
    isolate: true
    request:
      method: POST
      path: /api/v1/orgs/acme/contacts
      body: {kind: client, name: New Client}
    expect:
      status: 201
      body: {kind: client, name: New Client}
