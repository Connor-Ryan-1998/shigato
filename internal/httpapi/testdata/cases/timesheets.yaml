# Timesheets routes: org isolation, full-replace project and task edits,
# entry ownership, the entry list filter and billing-run access.
seed:
  orgs: [acme, other]
  users:
    owner: {org: acme, role: owner}
    keeper: {org: acme, role: bookkeeper}
  contacts:
    c_client: {org: acme, kind: client, name: A Client}
    c_foreign: {org: other, kind: client, name: Other Client}
  projects:
    # Both "Website rebuild" at 12000 cents an hour, GST, in progress.
    pr: {org: acme, client: c_client}
    pr_foreign: {org: other, client: c_foreign}
  tasks:
    tk: {org: acme, project: pr, name: Design}
    tk_rated: {org: acme, project: pr, name: Review, rate: 5000}

cases:
  - name: owner cannot add a task to a foreign org's project
    as: owner
    request:
      method: POST
      path: "/api/v1/orgs/acme/projects/{pr_foreign}/tasks"
      body: {name: Design}
    expect: {status: 404, body: {error: not found}, exact: true}
    unchanged: [project_tasks, audit_log]

  # PUT /projects/{id} is a full replace: an omitted field is a 422, never
  # a silent default (an omitted active flag could re-activate a project).
  - name: project update needs name
    as: owner
    request:
      method: PUT
      path: "/api/v1/orgs/acme/projects/{pr}"
      body: {client_contact_id: "{c_client}", hourly_rate: 12000, gst_code: GST, status: completed, description: Done, start_date: "2026-01-01", end_date: null, billing_method: fixed}
    expect: {status: 422, body: {error: "name is required"}}
    unchanged: [projects, audit_log]
  - name: project update needs client_contact_id
    as: owner
    request:
      method: PUT
      path: "/api/v1/orgs/acme/projects/{pr}"
      body: {name: Website rebuild, hourly_rate: 12000, gst_code: GST, status: completed, description: Done, start_date: "2026-01-01", end_date: null, billing_method: fixed}
    expect: {status: 422, body: {error: "client_contact_id is required"}}
    unchanged: [projects, audit_log]
  - name: project update needs hourly_rate
    as: owner
    request:
      method: PUT
      path: "/api/v1/orgs/acme/projects/{pr}"
      body: {name: Website rebuild, client_contact_id: "{c_client}", gst_code: GST, status: completed, description: Done, start_date: "2026-01-01", end_date: null, billing_method: fixed}
    expect: {status: 422, body: {error: "hourly_rate is required"}}
    unchanged: [projects, audit_log]
  - name: project update needs gst_code
    as: owner
    request:
      method: PUT
      path: "/api/v1/orgs/acme/projects/{pr}"
      body: {name: Website rebuild, client_contact_id: "{c_client}", hourly_rate: 12000, status: completed, description: Done, start_date: "2026-01-01", end_date: null, billing_method: fixed}
    expect: {status: 422, body: {error: "gst_code is required"}}
    unchanged: [projects, audit_log]
  - name: project update needs status
    as: owner
    request:
      method: PUT
      path: "/api/v1/orgs/acme/projects/{pr}"
      body: {name: Website rebuild, client_contact_id: "{c_client}", hourly_rate: 12000, gst_code: GST, description: Done, start_date: "2026-01-01", end_date: null, billing_method: fixed}
    expect: {status: 422, body: {error: "status is required"}}
    unchanged: [projects, audit_log]
  - name: project update needs description
    as: owner
    request:
      method: PUT
      path: "/api/v1/orgs/acme/projects/{pr}"
      body: {name: Website rebuild, client_contact_id: "{c_client}", hourly_rate: 12000, gst_code: GST, status: completed, start_date: "2026-01-01", end_date: null, billing_method: fixed}
    expect: {status: 422, body: {error: "description is required"}}
    unchanged: [projects, audit_log]
  - name: project update needs start_date
    as: owner
    request:
      method: PUT
      path: "/api/v1/orgs/acme/projects/{pr}"
      body: {name: Website rebuild, client_contact_id: "{c_client}", hourly_rate: 12000, gst_code: GST, status: completed, description: Done, end_date: null, billing_method: fixed}
    expect: {status: 422, body: {error: "start_date is required (use null for none)"}}
    unchanged: [projects, audit_log]
  - name: project update needs end_date
    as: owner
    request:
      method: PUT
      path: "/api/v1/orgs/acme/projects/{pr}"
      body: {name: Website rebuild, client_contact_id: "{c_client}", hourly_rate: 12000, gst_code: GST, status: completed, description: Done, start_date: "2026-01-01", billing_method: fixed}
    expect: {status: 422, body: {error: "end_date is required (use null for none)"}}
    unchanged: [projects, audit_log]
  - name: project update needs billing_method
    as: owner
    request:
      method: PUT
      path: "/api/v1/orgs/acme/projects/{pr}"
      body: {name: Website rebuild, client_contact_id: "{c_client}", hourly_rate: 12000, gst_code: GST, status: completed, description: Done, start_date: "2026-01-01", end_date: null}
    expect: {status: 422, body: {error: "billing_method is required"}}
    unchanged: [projects, audit_log]
  - name: project update with every field replaces the project
    as: owner
    isolate: true
    request:
      method: PUT
      path: "/api/v1/orgs/acme/projects/{pr}"
      body: {name: Website rebuild, client_contact_id: "{c_client}", hourly_rate: 12000, gst_code: GST, status: completed, description: Done, start_date: "2026-01-01", end_date: null, billing_method: fixed}
    expect:
      status: 200
      body: {status: completed, active: false, description: Done, start_date: "2026-01-01", end_date: null, billing_method: fixed}

  # PUT /tasks/{id} must name hourly_rate (null clears the override); an
  # omitted key is not "leave the override alone".
  - name: task update needs the hourly_rate key
    as: owner
    request:
      method: PUT
      path: "/api/v1/orgs/acme/tasks/{tk}"
      body: {name: Design, active: true}
    expect: {status: 422, body: {error: "hourly_rate is required (use null to clear the override)"}}
    unchanged: [project_tasks, audit_log]
  # The response is the updated row (RETURNING), so it shows what was
  # stored. A task without an override omits hourly_rate, so the exact
  # body proves the override is gone.
  - name: task update with a null hourly_rate clears the override
    as: owner
    isolate: true
    request:
      method: PUT
      path: "/api/v1/orgs/acme/tasks/{tk_rated}"
      body: {name: Review, active: true, hourly_rate: null}
    expect:
      status: 200
      body: {id: "{tk_rated}", project_id: "{pr}", name: Review, active: true}
      exact: true

  # POST /time-entries always logs time under the caller.
  - name: time entry is logged as the caller
    as: owner
    isolate: true
    request:
      method: POST
      path: /api/v1/orgs/acme/time-entries
      body: {task_id: "{tk}", work_date: "2026-11-01", minutes: 60, note: work}
    expect:
      status: 201
      body: {task_id: "{tk}", user_id: "{owner}", minutes: 60}

  # unbilled accepts only "true"; anything else is a 422, not an ignored
  # filter.
  - name: entry list rejects an unbilled value other than true
    as: owner
    request: {method: GET, path: "/api/v1/orgs/acme/time-entries?unbilled=yes"}
    expect: {status: 422, body: {error: "unbilled must be true"}}

  - name: bookkeeper cannot preview billing
    as: keeper
    request: {method: GET, path: "/api/v1/orgs/acme/billing-runs/preview?client_contact_id={c_client}&from=2026-11-01&to=2026-11-30"}
    expect: {status: 403, body: {error: forbidden}, exact: true}

  - name: bookkeeper cannot run billing
    as: keeper
    request:
      method: POST
      path: /api/v1/orgs/acme/billing-runs
      body: {client_contact_id: "{c_client}", from: "2026-11-01", to: "2026-11-30", due_in_days: 14, split: combined, tasks: [{task_id: "{tk}", minutes: 60, amount: 12000}]}
    expect: {status: 403, body: {error: forbidden}, exact: true}
    unchanged: [invoices, invoice_lines, time_entries, audit_log]

  - name: preview rejects a foreign client
    as: owner
    request: {method: GET, path: "/api/v1/orgs/acme/billing-runs/preview?client_contact_id={c_foreign}&from=2026-11-01&to=2026-11-30"}
    expect: {status: 422, body: {error: "invalid input: client_contact_id not found"}}

  - name: preview rejects a reversed range
    as: owner
    request: {method: GET, path: "/api/v1/orgs/acme/billing-runs/preview?client_contact_id={c_client}&from=2026-11-30&to=2026-11-01"}
    expect: {status: 422, body: {error: "invalid input: from must not be after to"}}

  # The seed logs no time, so the preview is empty.
  - name: preview with no unbilled time is empty
    as: owner
    request: {method: GET, path: "/api/v1/orgs/acme/billing-runs/preview?client_contact_id={c_client}&from=2026-11-01&to=2026-11-30"}
    expect: {status: 200, body: {projects: [], minutes: 0, amount: 0, gst_amount: 0}, exact: true}

  - name: billing run needs a selection
    as: owner
    request:
      method: POST
      path: /api/v1/orgs/acme/billing-runs
      body: {client_contact_id: "{c_client}", from: "2026-11-01", to: "2026-11-30", due_in_days: 14, split: combined, tasks: []}
    expect: {status: 422, body: {error: "invalid input: tasks must not be empty"}}
    unchanged: [invoices, invoice_lines, invoice_counters, time_entries, audit_log]

  # Nothing is logged against tk, so a selection claiming 60 minutes no
  # longer matches what is unbilled.
  - name: billing run refuses a stale selection
    as: owner
    request:
      method: POST
      path: /api/v1/orgs/acme/billing-runs
      body: {client_contact_id: "{c_client}", from: "2026-11-01", to: "2026-11-30", due_in_days: 14, split: combined, tasks: [{task_id: "{tk}", minutes: 60, amount: 12000}]}
    expect: {status: 409, body: {error: "billing preview changed; refresh and review"}}
    unchanged: [invoices, invoice_lines, invoice_counters, time_entries, audit_log]
