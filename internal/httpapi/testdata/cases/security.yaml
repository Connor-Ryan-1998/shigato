  # POST /invoices/{id}/payments: owner, staff, keeper.
  - name: POST /invoices/{id}/payments as an allowed role
    as: [owner, staff, keeper]
    request: {method: POST, path: "/api/v1/orgs/acme/invoices/999999/payments", body: {}}
