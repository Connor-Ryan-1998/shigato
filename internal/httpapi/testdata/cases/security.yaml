  # GET /reports/transactions.csv: owner, staff, keeper.
  - name: GET /reports/transactions.csv as an allowed role
    as: [owner, staff, keeper]
    request: {method: GET, path: "/api/v1/orgs/acme/reports/transactions.csv?from=2026-07-01&to=2026-07-01"}
