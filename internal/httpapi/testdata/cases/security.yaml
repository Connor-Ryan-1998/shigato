# Cross-cutting access control.
#
# The financial route matrix: each route is tried by every role in its own
# org (allowed roles reach validation or the handler, the rest get 403), by
# every role in an org they don't belong to (404) and anonymously (401).
# Every request is invalid or read-only, so none may change financial data,
# and denials carry only the error word.
seed:
  orgs: [acme, foreign]
  users:
    owner: {org: acme, role: owner}
    staff: {org: acme, role: staff}
    keeper: {org: acme, role: bookkeeper}
    tenant: {org: acme, role: tenant, contact: c_tenant}
    client: {org: acme, role: client, contact: c_client}
  contacts:
    c_tenant: {org: acme, kind: tenant, name: Tina Tenant}
    c_client: {org: acme, kind: client, name: Cal Client}
    c_foreign: {org: foreign, kind: client, name: Foreign Client}
  invoices:
    draft_foreign: {org: foreign, contact: c_foreign, amount: 1000}
    open_foreign: {org: foreign, contact: c_foreign, amount: 1000, status: issued}

cases:
  - name: anonymous cannot read me
    as: anonymous
    request: {method: GET, path: /api/v1/me}
    expect: {status: 401, body: {error: unauthorized}}

  # An acme owner naming foreign records through acme's routes is refused
  # without revealing them, and nothing is written.
  - name: owner cannot invoice a foreign org's contact
    as: owner
    request:
      method: POST
      path: /api/v1/orgs/acme/invoices
      body:
        contact_id: "{c_foreign}"
        source: manual
        due_in_days: 14
        lines: [{description: Work, quantity_milli: 1000, unit_amount: 1000, gst_code: N-T}]
    expect: {status: 422, body: {error: "invalid input: contact_id not found"}}
    unchanged: [invoices, payments, invoice_counters, audit_log]

  - name: owner cannot issue a foreign org's draft
    as: owner
    request: {method: POST, path: "/api/v1/orgs/acme/invoices/{draft_foreign}/issue"}
    expect: {status: 404, body: {error: not found}}
    unchanged: [invoices, payments, invoice_counters, audit_log]

  - name: owner cannot pay a foreign org's invoice
    as: owner
    request:
      method: POST
      path: "/api/v1/orgs/acme/invoices/{open_foreign}/payments"
      body: {amount: 400, method: bank_transfer, paid_on: "2026-11-13"}
    expect: {status: 404, body: {error: not found}}
    unchanged: [invoices, payments, invoice_counters, audit_log]


  # PUT /settings: owner.
  - name: PUT /settings as an allowed role
    as: owner
    request: {method: PUT, path: "/api/v1/orgs/acme/settings", body: {}}
    expect: {status: 422}
    unchanged: [orgs, invoices, payments, time_entries, audit_log]
  - name: PUT /settings is forbidden to other roles
    as: [staff, keeper, tenant, client]
    request: {method: PUT, path: "/api/v1/orgs/acme/settings", body: {}}
    expect: {status: 403, body: {error: forbidden}}
    unchanged: [orgs, invoices, payments, time_entries, audit_log]
  - name: PUT /settings in a foreign org is not found
    as: [owner, staff, keeper, tenant, client]
    request: {method: PUT, path: "/api/v1/orgs/foreign/settings", body: {}}
    expect: {status: 404, body: {error: not found}}
    unchanged: [orgs, invoices, payments, time_entries, audit_log]
  - name: PUT /settings needs a session
    as: anonymous
    request: {method: PUT, path: "/api/v1/orgs/acme/settings", body: {}}
    expect: {status: 401, body: {error: unauthorized}}
    unchanged: [orgs, invoices, payments, time_entries, audit_log]
  - name: PUT /settings in a foreign org needs a session
    as: anonymous
    request: {method: PUT, path: "/api/v1/orgs/foreign/settings", body: {}}
    expect: {status: 401, body: {error: unauthorized}}
    unchanged: [orgs, invoices, payments, time_entries, audit_log]

  # POST /invoices: owner, staff.
  - name: POST /invoices as an allowed role
    as: [owner, staff]
    request: {method: POST, path: "/api/v1/orgs/acme/invoices", body: {}}
    expect: {status: 422}
    unchanged: [orgs, invoices, payments, time_entries, audit_log]
  - name: POST /invoices is forbidden to other roles
