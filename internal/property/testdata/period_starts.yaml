# periodStart(terms, n) for monthly leases: want_starts[n] is period n's start.
- name: 31st anchor does not drift
  start: "2026-01-31"
  want_starts: ["2026-01-31", "2026-02-28", "2026-03-31", "2026-04-30"]

- name: 31st anchor in a leap year
  start: "2028-01-31"
  want_starts: ["2028-01-31", "2028-02-29"]

- name: 30th anchor
  start: "2026-01-30"
  want_starts: ["2026-01-30", "2026-02-28", "2026-03-30", "2026-04-30"]

- name: 29th anchor in a leap year
  start: "2028-01-29"
  want_starts: ["2028-01-29", "2028-02-29", "2028-03-29"]
