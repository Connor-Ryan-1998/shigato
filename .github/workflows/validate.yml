name: Validate shigoto

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: go-task/setup-task@v1
      - run: task web:install web:test
      # Build the SPA before the Go tests, so internal/webui's tests (e.g.
      # TestWebUIEveryInlineScriptHasMatchingHash) run against the real
      # index.html rather than the "not built" placeholder.
      - run: task web:build
      - run: task lint
      - run: task test
      - run: task test SUITE=integration
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: task web:e2e
      - name: Build container image
        run: docker build -t shigoto:ci .
