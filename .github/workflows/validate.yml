name: Validate shigoto

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: go-task/setup-task@v1
      - run: task web:install
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: task verify 2>&1 | tee verify.log
        shell: bash
      - run: task audit 2>&1 | tee audit.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: validation-failure
          path: |
            verify.log
            audit.log
            web/test-results/
  container:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate GHCR for main publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build verified Shigoto images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/connor-ryan-1998/shigoto:latest
            ghcr.io/connor-ryan-1998/shigoto:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Connor-Ryan-1998/shigato
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
