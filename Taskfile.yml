version: "3"

vars:
  SUITE: '{{.SUITE | default "unit"}}'

tasks:
  test:
    desc: Run tests. SUITE=unit (default) or SUITE=integration.
    cmds:
      - task: test-{{.SUITE}}

  test-unit:
    internal: true
    cmds:
      - go test -race ./...

  test-integration:
    internal: true
    cmds:
      - docker compose up -d --wait db
      - SHIGOTO_TEST_DATABASE_URL=postgres://shigoto:shigoto@localhost:5432/shigoto_test?sslmode=disable go test -race -tags integration -count=1 ./...

  build:
    desc: Build the shigoto binary.
    deps: [web:build]
    cmds:
      - go build -trimpath -o bin/shigoto ./cmd/shigoto

  dev:
    desc: Run the server locally against a running db.
    cmds:
      - docker compose up -d --wait db
      - SHIGOTO_DATABASE_URL=postgres://shigoto:shigoto@localhost:5432/shigoto?sslmode=disable SHIGOTO_BASE_URL=http://localhost:8080 go run ./cmd/shigoto serve

  web:install:
    desc: Install the web app's npm dependencies.
    dir: web
    cmds:
      - npm ci

  web:build:
    desc: Build the web app into internal/webui/dist.
    dir: web
    cmds:
      - npm run build

  web:test:
    desc: Type-check and unit-test the web app.
    dir: web
    cmds:
      - npm run check
      - npm test -- --run

  web:check:
    desc: Type-check the web app (no tests).
    dir: web
    cmds:
      - npm run check

  web:dev:
    desc: Run the web app's dev server (proxies /api and /webhooks to task dev's backend).
    dir: web
    cmds:
      - npm run dev

  lint:
    desc: Check formatting and vet the code.
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "$unformatted"
          echo "gofmt: files need formatting" >&2
          exit 1
        fi
      - go vet ./...
      - task: web:check
